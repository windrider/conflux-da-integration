services:
  conflux-chain:
    image: conflux-chain
    build:
      context: ./blockchain
      dockerfile: Dockerfile
    ports:
      - "8545:8545"  # eSpace RPC
      - "8546:8546"  # eSpace WebSocket
      - "12537:12537"  # Conflux RPC
      - "12535:12535"  # Conflux WebSocket
      - "32323:32323"  # P2P
    volumes:
      - ./blockchain/run/conflux.toml:/config/conflux.toml:ro
      - conflux-data:/data
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f -X POST -H 'Content-Type: application/json' -d '{\"jsonrpc\":\"2.0\",\"method\":\"eth_blockNumber\",\"params\":[],\"id\":1}' http://localhost:8545 | grep result"]
      interval: 6s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  fund-accounts:
    image: python:3.11-slim
    depends_on:
      conflux-chain:
        condition: service_healthy
    network_mode: "service:conflux-chain"
    volumes:
      - ./fund_accounts.py:/fund_accounts.py:ro
    command: ["/bin/bash", "-c", "pip install -i https://pypi.tuna.tsinghua.edu.cn/simple web3 && python3 /fund_accounts.py"]

  conflux-da-contract:
    image: 0g-da-contract
    build:
      context: ./da-contract
      dockerfile: Dockerfile
    depends_on:
      fund-accounts:
        condition: service_completed_successfully
    environment:
      - DEPLOYER_KEY=02c3357d2ae0a59e18f62ab69093cc22eac1a25c9f78af7f78650939ecda5f62
      - DEPLOYMENTS_JSON=/app/deployments/zg/da-addresses.json
      - DA_NODE_DIR=/da-node
    volumes:
      - ./da-contract/cache:/root/.cache
      - ./da-contract/0g-da-contract/deployments:/app/deployments
      - ./da-node:/da-node:rw
      - ./scripts:/scripts:ro
    network_mode: "service:conflux-chain"
    command: sh -c "yarn deploy zg && python3 /scripts/apply_da_addresses.py"

  # Permissionless finalizeEpoch() — official maintainer keeper (anyone may run a copy).
  da-finalize-keeper:
    image: python:3.11-slim
    depends_on:
      conflux-da-contract:
        condition: service_completed_successfully
    network_mode: "service:conflux-chain"
    volumes:
      - ./scripts/da_finalize_keeper.py:/da_finalize_keeper.py:ro
      - ./da-node/0g-da-node/abis/IDASigners.json:/abis/IDASigners.json:ro
      - ./da-contract/0g-da-contract/deployments:/deployments:ro
    environment:
      - PYTHONUNBUFFERED=1
      - RPC_URL=http://127.0.0.1:8545
      - DEPLOYMENTS_JSON=/deployments/zg/da-addresses.json
      - KEEPER_PRIVATE_KEY=02c3357d2ae0a59e18f62ab69093cc22eac1a25c9f78af7f78650939ecda5f62
      - EPOCH_BLOCKS=100
      - POLL_INTERVAL_SEC=10
      - MIN_BLOCK_GAS=30000000
    command:
      - /bin/bash
      - -c
      - |
        pip install -q -i https://pypi.tuna.tsinghua.edu.cn/simple web3 && \
        exec python3 /da_finalize_keeper.py
    restart: unless-stopped

  conflux-da-node:
    image: conflux-da-integration-0g-da-node:patched
    depends_on:
      conflux-da-contract:
        condition: service_completed_successfully
    volumes:
      - ./da-node/config.toml:/config.toml:ro
    network_mode: "service:conflux-chain"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "34001"]
      interval: 6s 
      timeout: 5s  
      retries: 12   
    command: ["sh", "-c", "sleep 5 && server --config config.toml"]

  conflux-da-node-2:
    image: conflux-da-integration-0g-da-node:patched
    depends_on:
      conflux-da-contract:
        condition: service_completed_successfully
    volumes:
      - ./da-node/config2.toml:/config.toml:ro
    network_mode: "service:conflux-chain"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "34002"]
      interval: 6s 
      timeout: 5s  
      retries: 12   
    command: ["sh", "-c", "sleep 5 && server --config config.toml"]

  conflux-da-node-3:
    image: conflux-da-integration-0g-da-node:patched
    depends_on:
      conflux-da-contract:
        condition: service_completed_successfully
    volumes:
      - ./da-node/config3.toml:/config.toml:ro
    network_mode: "service:conflux-chain"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "34003"]
      interval: 6s 
      timeout: 5s  
      retries: 12   
    command: ["sh", "-c", "sleep 5 && server --config config.toml"]

  conflux-da-encoder:
    image: 0g-da-encoder
    volumes:
      - ./da-encoder/params:/params:ro
    command: server --config config.toml
    network_mode: "service:conflux-chain"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  conflux-da-disperser:
    image: 0g-da-disperser
    depends_on: 
      conflux-da-node:
        condition: service_healthy
      conflux-da-node-2:
        condition: service_healthy
      conflux-da-node-3:
        condition: service_healthy
      conflux-da-encoder:
        condition: service_started
    network_mode: "service:conflux-chain"
    env_file:
      - ./da-contract/0g-da-contract/deployments/zg/da-addresses.env
    command:
      - sh
      - -c
      - |
        set -e
        test -n "$$DASIGNERS_ADDRESS" && test -n "$$DA_ENTRANCE_ADDRESS"
        exec /combined \
          --chain.rpc http://localhost:8545/ \
          --chain.private-key 58095a53ea065b7dc3065365b2a8f6797f26464381bb6a34f8337f010a63cb63 \
          --chain.receipt-wait-rounds 180 \
          --chain.receipt-wait-interval 1s \
          --chain.gas-limit 2000000 \
          --combined-server.use-memory-db \
          --batcher.da-entrance-contract "$$DA_ENTRANCE_ADDRESS" \
          --batcher.da-signers-contract "$$DASIGNERS_ADDRESS" \
          --combined-server.storage.kv-db-path /data \
          --combined-server.storage.time-to-expire 300 \
          --disperser-server.grpc-port 51001 \
          --batcher.pull-interval 30s \
          --batcher.signed-pull-interval 60s \
          --batcher.finalizer-interval 20s \
          --batcher.confirmer-num 3 \
          --batcher.max-num-retries-for-sign 10 \
          --signing-timeout 180s \
          --batcher.finalized-block-count 50 \
          --batcher.encoding-request-queue-size 1 \
          --encoder-socket localhost:34000 \
          --batcher.batch-size-limit 500 \
          --encoding-timeout 900s \
          --chain-read-timeout 12s \
          --chain-write-timeout 13s

  # ============================================
  # Retriever 服务（数据恢复测试专用）
  # 默认不启动，使用 profile 控制
  # 启动方式: docker compose --profile recovery up -d conflux-da-retriever
  # 容错测试: 通过 SKIP_NODES 环境变量控制跳过的节点数
  #   SKIP_NODES=0: 使用所有 3 个节点 (默认)
  #   SKIP_NODES=1: 只用 2 个节点 (测试 1 节点失效)
  #   SKIP_NODES=2: 只用 1 个节点 (测试 2 节点失效)
  # ============================================
  conflux-da-retriever:
    image: 0g-da-retriever
    build:
      context: ./da-encoder
      dockerfile: Dockerfile.retriever
    profiles:
      - recovery
    network_mode: "service:conflux-chain"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "34005"]
      interval: 3s
      timeout: 3s
      retries: 10
    command: retriever --grpc-listen-address 0.0.0.0:34005 --da-node-addresses localhost:34001,localhost:34002,localhost:34003 --skip-nodes ${SKIP_NODES:-0}

  # ============================================
  # 数据恢复测试客户端（可选）
  # 默认不启动，使用 profile 控制
  # 启动方式: docker compose --profile recovery run --rm conflux-da-recovery-test
  # 注意: 使用 'run' 而非 'up'，因为这是一次性测试任务
  # ============================================
  conflux-da-recovery-test:
    image: 0g-da-test-client
    profiles:
      - recovery
    # 使用前需手动确保 Disperser 和 Retriever 已启动
    network_mode: "service:conflux-chain"
    command: client zgda-store --url http://localhost:51001 --block-size 1024 --stop

  conflux-da-test-client:
    image: 0g-da-test-client
    depends_on:
      - conflux-da-disperser
    command: client zgda-disperse --url http://localhost:51001
    network_mode: "service:conflux-chain"

volumes:
  conflux-data: